# ─── SPA Routing Fallback ──────────────────────────────────────────────────────
# Because we prerender each route as index.html, Netlify serves static HTML directly.
# This fallback catches any paths not matched by a static file (e.g., 404s).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
